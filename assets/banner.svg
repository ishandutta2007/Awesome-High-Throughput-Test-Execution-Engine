<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="cyanOrb" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.15); opacity: 0.35; }
      100% { transform: scale(1); opacity: 0.2; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }
    @keyframes shimmer {
      0% { stop-color: #38bdf8; }
      50% { stop-color: #ec4899; }
      100% { stop-color: #38bdf8; }
    }
    .orb-anim-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 80% 20%;
    }
    .orb-anim-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 20% 80%;
    }
    .flow-stream {
      stroke-dasharray: 12 8;
      animation: flowLine 15s linear infinite;
    }
    .pill-group {
      animation: floatPill 5s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-anim-1" cx="950" cy="90" r="300" fill="url(#cyanOrb)" />
  <circle class="orb-anim-2" cx="150" cy="330" r="320" fill="url(#purpleOrb)" />

  <!-- Animated High-Throughput Concurrency Stream Lines (Background) -->
  <g opacity="0.45">
    <path class="flow-stream" d="M -50,110 C 250,90 400,160 700,120 C 950,90 1100,150 1250,130" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-stream" d="M -50,140 C 200,160 450,100 750,150 C 980,190 1120,110 1250,140" fill="none" stroke="#818cf8" stroke-width="1.8" />
    <path class="flow-stream" d="M -50,300 C 300,260 550,340 850,290 C 1050,260 1150,310 1250,290" fill="none" stroke="#c084fc" stroke-width="2" />
    <path class="flow-stream" d="M -50,330 C 220,350 480,280 800,330 C 1000,360 1120,300 1250,320" fill="none" stroke="#06b6d4" stroke-width="1.5" />
  </g>

  <!-- Decorative Corner Nodes (Visual test grid nodes) -->
  <g opacity="0.6">
    <circle cx="80" cy="60" r="4" fill="#38bdf8" />
    <circle cx="1120" cy="60" r="4" fill="#c084fc" />
    <circle cx="1120" cy="360" r="4" fill="#38bdf8" />
    <circle cx="80" cy="360" r="4" fill="#818cf8" />
    <line x1="80" y1="60" x2="140" y2="60" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="80" y1="60" x2="80" y2="120" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="1120" y1="60" x2="1060" y2="60" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="1120" y1="60" x2="1120" y2="120" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed sharp, readable, and non-obscured -->

  <!-- Top Pill / Tag -->
  <g class="pill-group" transform="translate(600, 95)" filter="url(#shadow)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="-155" cy="0" r="5" fill="#10b981" />
    <text class="badge-text" x="-140" y="5" fill="#38bdf8">ULTRA-PARALLEL ARCHITECTURES &amp; RUNNERS</text>
  </g>

  <!-- Main Repository Title -->
  <!-- Subtle dark glow underlay for pure contrast -->
  <text class="title-text" x="600" y="172" text-anchor="middle" fill="#000000" opacity="0.6" dx="0" dy="3">
    Awesome High-Throughput Test Execution Engines
  </text>
  <text class="title-text" x="600" y="170" text-anchor="middle" fill="url(#primaryGrad)">
    Awesome High-Throughput Test Execution Engines
  </text>

  <!-- Subtitle Line -->
  <text class="subtitle-text" x="600" y="216" text-anchor="middle" fill="#94a3b8">
    Distributed Test Orchestration • Dynamic Sharding • Self-Hosted Grids • Cloud Infrastructure
  </text>

  <!-- Architectural Feature Chips (Foreground) -->
  <g transform="translate(240, 275)" filter="url(#shadow)">
    <!-- Chip 1: Parallel Sharding -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="42" rx="2" fill="#38bdf8" />
      <text class="badge-text" x="20" y="26" fill="#f8fafc">⚡ Dynamic Sharding</text>
    </g>

    <!-- Chip 2: Cloud Grids -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="170" height="42" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="42" rx="2" fill="#818cf8" />
      <text class="badge-text" x="20" y="26" fill="#f8fafc">☁️ Distributed Grids</text>
    </g>

    <!-- Chip 3: Kubernetes Native -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="170" height="42" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="42" rx="2" fill="#c084fc" />
      <text class="badge-text" x="20" y="26" fill="#f8fafc">☸️ K8s Orchestration</text>
    </g>

    <!-- Chip 4: Zero Idle Latency -->
    <g transform="translate(560, 0)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="42" rx="2" fill="#34d399" />
      <text class="badge-text" x="20" y="26" fill="#f8fafc">🚀 High Throughput</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#primaryGrad)" />
</svg>
