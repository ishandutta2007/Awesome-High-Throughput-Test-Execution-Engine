<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".1"/></linearGradient><radialGradient id="cyanOrb" cx="80%" cy="20%" r="40%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".25"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="purpleOrb" cx="20%" cy="80%" r="40%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".2"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></radialGradient><pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1);opacity:.2}50%{transform:scale(1.15);opacity:.35}}@keyframes flowLine{0%{stroke-dashoffset:400}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes shimmer{0%{stop-color:#38bdf8}50%{stop-color:#ec4899}}.orb-anim-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:80% 20%}.orb-anim-2{animation:pulseOrb 10s ease-in-out infinite reverse;transform-origin:20% 80%}.flow-stream{stroke-dasharray:12 8;animation:flowLine 15s linear infinite}.pill-group{animation:floatPill 5s ease-in-out infinite}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:19px;letter-spacing:.2px}.badge-text{font-weight:600;font-size:13px;letter-spacing:.5px}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#cyberGrid)"/><circle cx="950" cy="90" r="300" fill="url(#cyanOrb)" class="orb-anim-1"/><circle cx="150" cy="330" r="320" fill="url(#purpleOrb)" class="orb-anim-2"/><g opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M -50,110 C 250,90 400,160 700,120 C 950,90 1100,150 1250,130" class="flow-stream"/><path fill="none" stroke="#818cf8" stroke-width="1.8" d="M -50,140 C 200,160 450,100 750,150 C 980,190 1120,110 1250,140" class="flow-stream"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M -50,300 C 300,260 550,340 850,290 C 1050,260 1150,310 1250,290" class="flow-stream"/><path fill="none" stroke="#06b6d4" stroke-width="1.5" d="M -50,330 C 220,350 480,280 800,330 C 1000,360 1120,300 1250,320" class="flow-stream"/></g><g opacity=".6"><circle cx="80" cy="60" r="4" fill="#38bdf8"/><circle cx="1120" cy="60" r="4" fill="#c084fc"/><circle cx="1120" cy="360" r="4" fill="#38bdf8"/><circle cx="80" cy="360" r="4" fill="#818cf8"/><line x1="80" x2="140" y1="60" y2="60" stroke="#334155" stroke-dasharray="3 3" stroke-width="1.5"/><line x1="80" x2="80" y1="60" y2="120" stroke="#334155" stroke-dasharray="3 3" stroke-width="1.5"/><line x1="1120" x2="1060" y1="60" y2="60" stroke="#334155" stroke-dasharray="3 3" stroke-width="1.5"/><line x1="1120" x2="1120" y1="60" y2="120" stroke="#334155" stroke-dasharray="3 3" stroke-width="1.5"/></g><g class="pill-group" filter="url(#shadow)" transform="translate(600, 95)"><rect width="360" height="36" x="-180" y="-18" fill="#1e293b" fill-opacity=".9" stroke="#38bdf8" stroke-width="1.2" rx="18"/><circle cx="-155" cy="0" r="5" fill="#10b981"/><text x="-140" y="5" fill="#38bdf8" class="badge-text">ULTRA-PARALLEL ARCHITECTURES &amp; RUNNERS</text></g><text x="600" y="172" fill="#000" class="title-text" dx="0" dy="3" opacity=".6" text-anchor="middle">Awesome High-Throughput Test Execution Engines</text><text x="600" y="170" fill="url(#primaryGrad)" class="title-text" text-anchor="middle">Awesome High-Throughput Test Execution Engines</text><text x="600" y="216" fill="#94a3b8" class="subtitle-text" text-anchor="middle">Distributed Test Orchestration • Dynamic Sharding • Self-Hosted Grids • Cloud Infrastructure</text><g filter="url(#shadow)" transform="translate(240, 275)"><g transform="translate(0, 0)"><rect width="160" height="42" x="0" y="0" fill="#0f172a" fill-opacity=".95" stroke="#334155" stroke-width="1.2" rx="8"/><rect width="4" height="42" x="0" y="0" fill="#38bdf8" rx="2"/><text x="20" y="26" fill="#f8fafc" class="badge-text">⚡ Dynamic Sharding</text></g><g transform="translate(180, 0)"><rect width="170" height="42" x="0" y="0" fill="#0f172a" fill-opacity=".95" stroke="#334155" stroke-width="1.2" rx="8"/><rect width="4" height="42" x="0" y="0" fill="#818cf8" rx="2"/><text x="20" y="26" fill="#f8fafc" class="badge-text">☁️ Distributed Grids</text></g><g transform="translate(370, 0)"><rect width="170" height="42" x="0" y="0" fill="#0f172a" fill-opacity=".95" stroke="#334155" stroke-width="1.2" rx="8"/><rect width="4" height="42" x="0" y="0" fill="#c084fc" rx="2"/><text x="20" y="26" fill="#f8fafc" class="badge-text">☸️ K8s Orchestration</text></g><g transform="translate(560, 0)"><rect width="160" height="42" x="0" y="0" fill="#0f172a" fill-opacity=".95" stroke="#334155" stroke-width="1.2" rx="8"/><rect width="4" height="42" x="0" y="0" fill="#34d399" rx="2"/><text x="20" y="26" fill="#f8fafc" class="badge-text">🚀 High Throughput</text></g></g><rect width="1200" height="5" x="0" y="415" fill="url(#primaryGrad)"/></svg>